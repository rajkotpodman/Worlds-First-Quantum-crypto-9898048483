name: "🐞 Bug Report"
description: "File a bug or issue with Token 9898048483 node, Android client, or ZKP verification"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with the World's First Post-Quantum Cryptographic Token 9898048483 platform.
  - type: input
    id: version
    attributes:
      label: System / Version
      description: What version of the client, server, or APK are you running? (e.g., v1.0.0, v2.0.0, commit hash)
      placeholder: "e.g. v2.0.0 / commit 3f1e85b"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      options:
        - "Post-Quantum Cryptography Core (NIST ML-DSA-87 / Dilithium)"
        - "Token 9898048483 Ledger & Smart Contract"
        - "eToken Pro / PKCS#11 Hardware Security Enclave"
        - "Zero-Knowledge Circuit / ZKP Verification"
        - "Android APK / Mobile Secure Space"
        - "Web Dashboard & Wallet UI"
        - "CI/CD Pipeline & GitHub Actions"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps.
      placeholder: |
        1. Run `...`
        2. Execute transaction `...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: Paste relevant terminal logs or attach error screenshots.
      render: shell
