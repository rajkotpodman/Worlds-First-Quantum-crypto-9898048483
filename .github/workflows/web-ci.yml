name: Web Frontend & Full-Stack CI Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-system-ci:
    name: Lint, Typecheck, Vite Build & Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Node & Python Dependencies
        run: |
          npm ci || npm install
          pip install pytest pytest-asyncio httpx numpy pycryptodome cryptography pydantic fastapi sqlalchemy pycdlib

      - name: 🔍 TypeScript Strict Typecheck (0 Errors)
        run: npm run lint

      - name: ⚡ Compile Production Frontend Bundle (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📊 Verify Output Dist Files & Structure
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          ls -lah dist/
          ls -lah dist/assets/

      - name: 🧪 Execute Python Backend & Cryptography Unit Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_token_system.py -v
