name: Android CI/CD Pipeline & APK Builder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APKs (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🔍 TypeScript Typecheck
        run: npx tsc --noEmit

      - name: ⚡ Build Vite Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔄 Sync Web Assets to Android Capacitor
        run: npx cap sync android

      - name: 🛠️ Build Android Debug & Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: 🔑 Compute SHA-256 Checksums
        run: |
          mkdir -p build_artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build_artifacts/ai-secure-space-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build_artifacts/ai-secure-space-release-unsigned.apk
          fi
          cd build_artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-secure-space-debug-apk
          path: build_artifacts/ai-secure-space-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: 📤 Upload Release Bundle & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: ai-secure-space-release-package
          path: build_artifacts/
          retention-days: 30
          if-no-files-found: warn
