name: Android CI/CD Pipeline & Standalone/Hybrid APK Builder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android Hybrid & Standalone APK (200+ MB)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Node & Python Dependencies
        run: |
          npm ci || npm install
          pip install pytest pytest-asyncio httpx numpy pycryptodome cryptography pydantic fastapi sqlalchemy pycdlib || true

      - name: 🔍 TypeScript Strict Typecheck (0 Errors)
        run: npm run lint

      - name: ⚡ Build Vite Web Application Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔄 Sync Capacitor Android Platform Assets
        run: npx cap sync android || echo "Capacitor sync optional"

      - name: 🛠️ Build Autonomous 200+ MB Standalone Hybrid APK
        run: |
          node scripts/bundle-hybrid-apk.js
          test -f dist/app-release.apk || { echo "dist/app-release.apk missing"; exit 1; }
          ls -lah dist/

      - name: 🔑 Compute Cryptographic SHA-256 & SHA-512 Checksums
        run: |
          mkdir -p build_artifacts/android
          cp -f dist/*.apk build_artifacts/android/ 2>/dev/null || true
          cp -f dist/*.sha256 build_artifacts/android/ 2>/dev/null || true
          cp -f dist/*.sha512 build_artifacts/android/ 2>/dev/null || true
          cd build_artifacts/android
          sha256sum *.apk > SHA256SUMS.txt
          sha512sum *.apk > SHA512SUMS.txt
          cat SHA256SUMS.txt

      - name: 📤 Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-secure-space-android-apks
          path: |
            build_artifacts/android/*.apk
            build_artifacts/android/*.sha256
            build_artifacts/android/*.sha512
            build_artifacts/android/*.txt
          retention-days: 30
          if-no-files-found: error
