# ==============================================================================
# GitHub CodeQL Advanced Static Analysis Security Testing (SAST)
# Project: Worlds-First-Quantum-crypto-9898048483
# Repository: https://github.com/rajkotpodman/Worlds-First-Quantum-crypto-9898048483
# Reference: https://docs.github.com/code-security/codeql-for-github-actions
# ==============================================================================

name: "CodeQL Advanced Security Analysis"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '30 2 * * 1' # Runs every Monday at 02:30 UTC (08:00 IST)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Scan (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Initialize CodeQL Engine
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      - name: 🛡️ Perform CodeQL Static Security Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
