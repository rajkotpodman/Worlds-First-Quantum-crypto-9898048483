name: Automated Release & APK Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: ⚡ Build Web Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🛠️ Build APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease --no-daemon

      - name: 📦 Package Artifacts
        run: |
          mkdir -p release_assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release_assets/ai-secure-space-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release_assets/ai-secure-space-release-unsigned.apk
          fi
          cd release_assets
          sha256sum * > SHA256SUMS.txt

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/ai-secure-space-debug.apk
            release_assets/ai-secure-space-release-unsigned.apk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
