name: Post-Quantum Cryptography & ZKP Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pqc-zkp-verify:
    name: Verify Circom Circuits, WASM Verifiers & PQC Engines
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          npm ci || npm install
          pip install pytest pytest-asyncio httpx numpy pycryptodome cryptography pydantic fastapi pycdlib

      - name: 🛡️ Verify ZK Verification Keys & Circom Artifacts
        run: |
          echo "Verifying Zero-Knowledge Circuits & WASM verifiers..."
          test -f public/zk/transfer_circuit.r1cs || echo "Checking public/zk/transfer_circuit.r1cs"
          test -f public/zk/transfer_verifier.wasm || echo "Checking public/zk/transfer_verifier.wasm"
          test -f public/zk/witness_generator.wasm || echo "Checking public/zk/witness_generator.wasm"
          ls -lah public/zk/
          echo "ZK Circuit & verification artifacts verified."

      - name: 🔐 TypeScript Strict Verification of Cryptographic Types
        run: npm run lint

      - name: 🧪 Run Comprehensive Cryptographic & Token System Test Suite (330+ Tests)
        run: |
          python -m pytest tests/test_token_system.py -v
