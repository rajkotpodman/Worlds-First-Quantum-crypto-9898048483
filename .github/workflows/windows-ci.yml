name: "Windows Native CI & PowerShell Verification"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test:
    name: Windows CI Runner
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pycryptodome pytest

      - name: 🛡️ Verify eToken Bridge & Sovereign Enclave Script
        run: |
          python scripts/etoken_manager.py
          python scripts/secure_51_percent_vault.py 9898048483

      - name: ⚙️ Verify PowerShell Script Syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path "scripts" -Filter "*.ps1"
          foreach ($s in $scripts) {
            Write-Host "Validating PowerShell AST for: $($s.Name)"
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "Syntax error in $($s.Name): $errors"
            }
          }
          Write-Host "All PowerShell scripts validated successfully."
